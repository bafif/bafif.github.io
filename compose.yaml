# Dev stack (rootless Podman): `podman compose up --build`, then http://localhost:8080.
# The repository is mounted read-only: nothing that runs in the container can change the sources or .git.
# Dependencies, Astro's cache and builds live in volumes; their mount points (node_modules, .astro, dist) have to
# exist in the checkout.
services:
  web:
    build: .
    volumes:
      - .:/app:ro
      - node_modules:/app/node_modules
      - astro:/app/.astro
      - dist:/app/dist
    environment:
      ASTRO_TELEMETRY_DISABLED: "1"
      HMR_CLIENT_PORT: "8080"
  nginx:
    image: docker.io/library/nginx:1.30-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
volumes:
  node_modules:
  astro:
  dist:
