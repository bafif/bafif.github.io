services:
  web:
    build: .
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    environment:
      ASTRO_TELEMETRY_DISABLED: "1"
      HMR_CLIENT_PORT: "8080"

  nginx:
    image: nginx:1.30-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web

volumes:
  node_modules:
