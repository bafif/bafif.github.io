<!doctype html>
<!--
  Source of public/og.jpg, the preview image that WhatsApp, Telegram, LinkedIn and others show when the site's
  link is shared. It is rendered at 1200x630 with headless Chrome; the command is in the README ("Link preview").
-->
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <title>Vista previa</title>
    <style>
      @font-face {
        font-family: "Fraunces";
        src: url("../src/styles/marca/fuentes/fraunces.woff2") format("woff2-variations");
        font-weight: 100 900;
      }
      @font-face {
        font-family: "Fraunces";
        src: url("../src/styles/marca/fuentes/fraunces-italica.woff2") format("woff2-variations");
        font-weight: 100 900;
        font-style: italic;
      }
      @font-face {
        font-family: "Instrument Sans";
        src: url("../src/styles/marca/fuentes/instrument-sans.woff2") format("woff2-variations");
        font-weight: 400 700;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("../src/styles/marca/fuentes/jetbrains-mono.woff2") format("woff2-variations");
        font-weight: 100 800;
      }

      * {
        box-sizing: border-box;
        margin: 0;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
      }

      /* Rojinegro: black with Newell's red stripes, ivory letters. */
      body {
        position: relative;
        display: grid;
        grid-template-columns: 1fr 470px;
        gap: 44px;
        align-items: center;
        padding: 56px 60px;
        background:
          radial-gradient(ellipse 60% 80% at 20% 40%, rgb(200 16 46 / 0.22), transparent 70%),
          repeating-linear-gradient(90deg, transparent 0 22px, rgb(226 0 26 / 0.1) 22px 44px),
          #0a0a0b;
        color: #f3efea;
        font-family: "Instrument Sans", system-ui, sans-serif;
      }

      .texto {
        position: relative;
        padding: 44px 44px 40px;
        border: 1px solid #2a2a2e;
        border-radius: 24px;
        background: rgb(10 10 11 / 0.78);
        box-shadow: 0 30px 60px -30px rgb(0 0 0 / 0.9), inset 0 1px 0 rgb(255 255 255 / 0.05);
      }

      .rotulo {
        display: flex;
        align-items: center;
        gap: 14px;
        font-family: "JetBrains Mono", monospace;
        font-size: 17px;
        font-weight: 600;
        letter-spacing: 0.14em;
        text-transform: uppercase;
        color: #9a938c;
      }

      .rotulo img {
        width: 44px;
        height: 44px;
      }

      h1 {
        margin-top: 22px;
        font-family: "Fraunces", Georgia, serif;
        font-variation-settings: "SOFT" 50, "WONK" 0;
        font-optical-sizing: auto;
        font-weight: 560;
        font-size: 98px;
        line-height: 1;
        letter-spacing: -0.02em;
      }

      h1 em {
        font-style: italic;
        font-variation-settings: "SOFT" 100, "WONK" 1;
        font-weight: 420;
        color: #ff7a82;
      }

      .lema {
        margin-top: 22px;
        font-size: 27px;
        line-height: 1.32;
        color: #bdb6ae;
      }

      .lema b {
        color: #f3efea;
        font-weight: 600;
      }

      .dominio {
        display: inline-block;
        margin-top: 28px;
        padding: 10px 20px;
        border-radius: 999px;
        background: #c8102e;
        color: #ffffff;
        font-family: "JetBrains Mono", monospace;
        font-size: 21px;
        font-weight: 600;
        letter-spacing: 0.02em;
      }

      /* A sample of the projects, each in its own look. */
      .proyectos {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 14px;
      }

      .proyectos figure {
        overflow: hidden;
        border: 1px solid #2a2a2e;
        border-radius: 14px;
        background: #131314;
        box-shadow: 0 16px 30px -18px rgb(0 0 0 / 0.9);
      }

      .proyectos img {
        display: block;
        width: 100%;
        height: 118px;
        object-fit: cover;
        object-position: center top;
      }

      .proyectos figcaption {
        padding: 8px 12px 10px;
        font-size: 17px;
        font-weight: 600;
        color: #f3efea;
      }

      .chip {
        display: grid;
        place-content: center;
        gap: 6px;
        height: 118px;
        text-align: center;
        font-family: "JetBrains Mono", monospace;
        background:
          linear-gradient(to right, rgb(42 46 51 / 0.7) 1px, transparent 1px),
          linear-gradient(to bottom, rgb(42 46 51 / 0.7) 1px, transparent 1px),
          #0e1012;
        background-size: 14px 14px;
      }

      .chip b {
        font-size: 22px;
        font-weight: 500;
        letter-spacing: 0.04em;
        color: #e9e6df;
      }

      .chip span {
        font-size: 13px;
        color: #9a9ea5;
      }
    </style>
  </head>
  <body>
    <div class="texto">
      <p class="rotulo"><img src="../public/marca/emblema-oscuro.svg" alt="" />Portfolio · Rosario</p>
      <h1>Bautista <em>Fiori</em></h1>
      <p class="lema">Un atlas de la historia, una app para fiscales, un editor de CV y una rocola. <b>Software que llega hasta el hardware.</b></p>
      <p class="dominio">bafif.github.io</p>
    </div>
    <div class="proyectos">
      <figure><img src="../public/img/proyectos/tellmap-egipto.webp" alt="" /><figcaption>TellMAP</figcaption></figure>
      <figure><img src="../public/img/proyectos/urna-telefonos-oscuro.webp" alt="" /><figcaption>Urna Abierta</figcaption></figure>
      <figure><img src="../public/img/proyectos/rocola-ambar-reproduciendo.webp" alt="" /><figcaption>Rocola</figcaption></figure>
      <figure><img src="../public/img/proyectos/foja-editor.webp" alt="" /><figcaption>Foja</figcaption></figure>
      <figure><img src="../public/img/proyectos/xport-popup.webp" alt="" style="object-position: center 6%" /><figcaption>xport</figcaption></figure>
      <figure>
        <div class="chip"><b>BCM21654</b><span>Cortex-A9 · sin idiv</span></div>
        <figcaption>EX Emulators</figcaption>
      </figure>
    </div>
  </body>
</html>
